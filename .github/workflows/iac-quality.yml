name: Infrastructure as Code Quality

on:
  workflow_call:
  push:
    branches: [desarrollo-local]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform-validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate aws-main environment
        run: |
          cd infra/terraform/environments/aws-main
          terraform init -backend=false
          terraform validate

      - name: Validate local-emulator environment
        run: |
          cd infra/terraform/environments/local-emulator
          terraform init -backend=false
          terraform validate
