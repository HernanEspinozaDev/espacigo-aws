name: Database migration quality

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true
      - name: Test inventory and connection guards
        run: go test ./cmd/dbmigrate ./internal/migrator
      - name: Test mandatory database evidence and inventory verifiers
        run: |
          python3 -m unittest discover -s scripts -p 'test_img01_schema_release_evidence.py' -v
      - name: Run mandatory isolated PostgreSQL migrations and failure recovery
        run: bash scripts/test-migration-runner-postgres.sh
